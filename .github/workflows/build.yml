name: build and test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  wheels:
    name: Linux / Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Build and test the installed wheel
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: sh scripts/test.sh "$PYTHON_VERSION"
      - name: Upload wheel and test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-python${{ matrix.python }}
          path: ci-results/python${{ matrix.python }}/
          retention-days: 14

  compatibility:
    name: Cross-Python persistence
    needs: wheels
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check release bundle validation
        run: python3 -m unittest discover -s scripts/tests -v
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-python3.9
          path: ci-results/python3.9
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-python3.13
          path: ci-results/python3.13
      - name: Verify databases and write batches across Python versions
        shell: bash
        run: |
          wheel=lbry_rocksdb_ng-0.8.3-cp313-cp313-manylinux_2_35_x86_64.whl
          curl --fail --location --retry 3 -o "$wheel" "https://github.com/kodxana/lbry-rocksdb-ng/releases/download/v0.8.3/$wheel"
          echo "9e905f44895e0815ef6e803da964ee648cfd970cc2621003a92bc822875e3e72  $wheel" | sha256sum -c -
          sh scripts/test-compatibility.sh "$wheel" 2>&1 | tee ci-results/compatibility.log
      - name: Upload compatibility log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cross-python-persistence
          path: ci-results/compatibility.log
          retention-days: 14
      - name: Collect tested release wheels
        run: python3 scripts/prepare-release.py
      - name: Upload release bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-wheels
          path: dist/
          if-no-files-found: error
          retention-days: 14
